<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="内容发现器：按分类预置关键词，在文本中高亮命中、统计分布并导出报告" />
    <title>内容发现器</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='14' cy='14' r='6.5' fill='none' stroke='white' stroke-width='2.6'/%3E%3Cpath d='M19 19l6 6' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // 在首帧渲染前应用主题，避免深色模式下的闪白
      try {
        var s = JSON.parse(localStorage.getItem('finder.settings.v1') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
